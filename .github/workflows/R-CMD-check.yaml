name: R-CMD-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Install check dependencies
        shell: Rscript {0}
        run: |
          renv::install(c("rcmdcheck", "roxygen2", "testthat"))

      - name: Check roxygen docs are up to date
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code -- NAMESPACE man/ || {
            echo "::error::Docs are out of date. Run roxygen2::roxygenise() and commit the changes."
            exit 1
          }

      - name: Run R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
