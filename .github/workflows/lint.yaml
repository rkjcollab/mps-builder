name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Run pre-commit
        run: |
          pre-commit run --all-files --show-diff-on-failure

  lintr:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LINTR_ERROR_ON_LINT: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      # lintr checks function calls against the installed package, so install
      # it first.
      - name: Install lintr and the package
        shell: Rscript {0}
        run: |
          renv::install(c("lintr", "."))

      - name: Lint
        shell: Rscript {0}
        run: |
          lintr::lint_package()
